<section class="stockfish-panel" aria-label="Stockfish engine">
  <small>
    <a
      href="https://github.com/nmrugg/stockfish.js/tree/v19.0.1"
      target="_blank"
      rel="noopener noreferrer"
      >Stockfish.js source</a
    >
    &middot;
    <a href="stockfish/Copying.txt" target="_blank" rel="noopener noreferrer">GPL-3.0 license</a>
  </small>
</section>

<ng-template class="analysis_view" #analysisView>
  @if ((mode() === 'analysis' || analysis()) && engine.result(); as result) {
    <p>Evaluation (White): {{ evaluation() || 'Calculating...' }}. Depth: {{ result.depth }}.</p>
    @if (variation(); as bestLine) {
      <p>Best line: {{ bestLine }}</p>
    }
  }
</ng-template>
