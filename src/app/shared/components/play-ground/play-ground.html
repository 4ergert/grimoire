<section class="game" aria-label="Local two-player chess">
  <app-game-controls
    [status]="trainingFolder() ? 'Folder training' : replayPositions().length ? 'Replay' : status()"
    [training]="mode() === 'training'"
    [replaying]="!!replayPositions().length"
    [flipped]="flipped()"
    [canSave]="!!moveHistory().length && promotion() === null"
    (back)="back.emit()"
    (flip)="flipped.set(!flipped())"
    (restart)="restart()"
    (save)="save()"
  />

  @if (replayError()) {
    <p role="alert">{{ replayError() }}</p>
  }
  @if (mode() === 'replay' && replayPositions().length) {
    <app-replay-controls
      [index]="replayIndex()"
      [moves]="replayMoves()"
      (navigate)="replayIndex.set($event)"
    />
  }
  @if (promotion(); as move) {
    <app-promotion-controls
      [square]="move.to"
      (choose)="promote($event)"
      (cancel)="promotion.set(null)"
    />
  }

  <app-chess-board
    [position]="displayPosition()"
    [flipped]="flipped()"
    [selected]="replayPositions().length ? null : selected()"
    [targets]="mode() === 'play' ? legalTargets() : []"
    [hint]="training()?.hintSquare() ?? null"
    [disabled]="promotion() !== null"
    (squareSelected)="select($event)"
  />
  @if (mode() === 'training') {
    <app-training-panel
      [session]="training()"
      [error]="trainingError()"
      (start)="startTraining($event)"
      (next)="nextTrainingGame()"
      (playSolution)="playTrainingSolution()"
    />
  } @else {
    <app-move-history
      [replaying]="!!replayPositions().length"
      [replayMoves]="replayMoves()"
      [history]="moveHistory()"
    />
  }
  <footer class="copyright">&copy; Julian Hergert</footer>
</section>
